name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test FastAPI app
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app

          client = TestClient(app)

          ui_response = client.get('/ui')
          assert ui_response.status_code == 200, ui_response.text

          predict_response = client.post('/predict', json={'text': 'hello world'})
          assert predict_response.status_code in (200, 503), predict_response.text

          if predict_response.status_code == 200:
              print('Prediction successful:', predict_response.json())
          else:
              print('Model not trained in CI environment yet:', predict_response.json())
          PY

      - name: Build Docker image
        run: docker build -t text-summarizer:latest .
