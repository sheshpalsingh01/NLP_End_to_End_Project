<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Summarizer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef6ff, #f6f8ff);
        color: #1f2937;
      }
      .container {
        max-width: 900px;
        margin: 60px auto;
        padding: 24px;
      }
      .card {
        background: white;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 30px;
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
        color: #1d4ed8;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        resize: vertical;
        padding: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font-size: 1rem;
        margin-top: 12px;
      }
      button {
        margin-top: 18px;
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .result {
        margin-top: 24px;
        padding: 18px 16px;
        background: #f8fafc;
        border-left: 5px solid #2563eb;
        border-radius: 10px;
        line-height: 1.6;
      }
      .error {
        border-left-color: #dc2626;
        background: #fef2f2;
        color: #991b1b;
      }
      .loading {
        color: #475569;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Text Summarizer</h1>
        <form id="predictForm">
          <label for="textInput">Enter text to summarize</label>
          <textarea id="textInput" placeholder="Paste a paragraph or article here...">Your laptop has limited processing power, and VS Code can consume a surprising amount of CPU and RAM, especially when running Python.</textarea>
          <button type="submit">Generate Summary</button>
        </form>

        <div id="resultBox" class="result" style="display:none;"></div>
      </div>
    </div>

    <script>
      const form = document.getElementById('predictForm');
      const textInput = document.getElementById('textInput');
      const resultBox = document.getElementById('resultBox');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = textInput.value.trim();

        if (!text) {
          resultBox.style.display = 'block';
          resultBox.className = 'result error';
          resultBox.textContent = 'Please enter some text before summarizing.';
          return;
        }

        resultBox.style.display = 'block';
        resultBox.className = 'result';
        resultBox.innerHTML = '<span class="loading">Generating summary...</span>';

        try {
          const response = await fetch('/predict', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ text }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || 'Prediction failed');
          }

          resultBox.className = 'result';
          resultBox.textContent = data.summary;
        } catch (error) {
          resultBox.className = 'result error';
          resultBox.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
