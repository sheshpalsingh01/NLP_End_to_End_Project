<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Summarizer</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #1f6feb;
        --primary-dark: #164fb4;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --success: #1f9d61;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f9fafb);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: 60px auto;
        padding: 30px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      .subtext {
        color: var(--muted);
        margin-bottom: 20px;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        font-size: 1rem;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .status {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .result-box {
        margin-top: 28px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9fbff;
        padding: 18px;
      }

      .result-box h3 {
        margin-top: 0;
      }

      .summary {
        color: var(--text);
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .error {
        color: #b91c1c;
      }

      @media (max-width: 640px) {
        .container {
          padding: 18px;
        }

        .card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Text Summarizer</h1>
        <p class="subtext">Paste long text and generate a concise summary instantly.</p>

        <textarea id="inputText" placeholder="Type or paste a long article, note, or document here..."></textarea>

        <div class="actions">
          <button id="summarizeBtn">Generate Summary</button>
          <span id="status" class="status">Ready</span>
        </div>

        <div class="result-box">
          <h3>Summary</h3>
          <div id="result" class="summary">Your summary will appear here.</div>
        </div>
      </div>
    </div>

    <script>
      const inputText = document.getElementById('inputText');
      const summarizeBtn = document.getElementById('summarizeBtn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      summarizeBtn.addEventListener('click', async () => {
        const text = inputText.value.trim();

        if (!text) {
          result.textContent = 'Please enter some text to summarize.';
          result.classList.add('error');
          return;
        }

        result.classList.remove('error');
        status.textContent = 'Generating...';
        result.textContent = 'Processing...';

        try {
          const response = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || 'Request failed');
          }

          result.textContent = data.summary || 'No summary returned.';
          status.textContent = 'Done';
        } catch (err) {
          result.textContent = err.message;
          result.classList.add('error');
          status.textContent = 'Error';
        }
      });
    </script>
  </body>
</html>
